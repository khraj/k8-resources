apiVersion: v1
kind: Pod
metadata:
  name: emptyDir-demo
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMount:
    - mountPath: /var/log/nginx
      name: nginx-logs
  - name: almalinux
    image: almalinux:9
    volumeMount:
    - mountPath: /mnt/nginx-log
      name: nginx-logs
      readOnly: true
  volume:
  - name: nginx-logs
    emptyDir:
      sizeLimit: 100Mi