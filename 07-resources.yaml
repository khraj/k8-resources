apiVersion: v1
kind: Pod
metadata:
  name: resources-demo
  project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "68mi"
        cpu: "100m"  #1/10th of CPU
      # provide equal or more than requests
      limits:
        memory: "100mi"
        cpu: "120m" 